; The php:cli image defaults to 128M, which is tight for Laravel and was
; the exact ceiling the dashboard hit: a fatal error, so it reached the
; browser as a bare 500 with nothing in the response to explain it.
;
; The real fix is not loading a hundred thousand rows into memory — see
; MetricSeries::collapse. This is headroom, so that the next thing to
; grow unexpectedly gets slow rather than dying.
memory_limit = 256M
