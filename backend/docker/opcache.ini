; The extension was installed but never switched on.
;
; `artisan serve` runs under the CLI SAPI, where opcache defaults to off,
; so every request recompiled the whole framework from source. Enabling
; it is the difference between parsing ~1,500 PHP files per request and
; parsing them once per worker.
opcache.enable=1
opcache.enable_cli=1

opcache.memory_consumption=192
opcache.interned_strings_buffer=16

; Laravel plus vendor is comfortably over the 10,000 default, and files
; past the limit are silently left uncompiled.
opcache.max_accelerated_files=20000

; The code in an image cannot change while it runs — a deploy builds a
; new one. So there is nothing to check for, and checking costs a stat
; call per file per request.
opcache.validate_timestamps=0
