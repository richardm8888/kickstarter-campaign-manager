server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app is mostly one big JavaScript download, and nginx's default
    # is to send it uncompressed: 816 KB where 235 KB would do. On a
    # phone that difference is the page load.
    #
    # gzip_types excludes text/html because nginx always compresses it.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        image/svg+xml
        application/manifest+json;

    # Docker's embedded DNS, which is where the `backend` name lives.
    #
    # nginx resolves a name written literally in proxy_pass exactly once,
    # when the configuration loads, and then keeps that address for the
    # life of the process. A deploy gives the backend container a new IP,
    # so nginx was left proxying to an address nothing answers on: the
    # page shell still loads, because that comes off nginx's own disk,
    # and every API call fails. Naming a resolver and putting the address
    # in a variable forces nginx to look it up again as it expires.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Must be a variable — a literal here is resolved once and cached
        # forever, which is the bug this is fixing. With no path on the
        # end, nginx forwards the original request URI unchanged.
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset filename, so a given URL
    # can never change meaning. Telling the browser that turns each
    # later page load from a revalidation round trip into a cache read.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one file whose URL does outlive its content: it
    # names the current asset hashes. Cached, a deploy would not arrive.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
