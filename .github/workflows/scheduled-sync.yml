name: Hourly integration sync

# Free-tier replacement for the resident Laravel scheduler: pings the app's
# protected sync endpoint so connected integrations pull fresh data hourly.
# Requires two repository secrets:
#   APP_URL     — the deployed app's base URL (e.g. https://kickstarter-launch-os.onrender.com)
#   CRON_SECRET — the CRON_SECRET value from the hosting environment

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not configured — skipping."
            exit 0
          fi
          # -m 180 allows for a free-tier cold start before the sync runs.
          curl -fsS -m 180 -X POST "$APP_URL/api/internal/run-sync" \
            -H "Accept: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET"
