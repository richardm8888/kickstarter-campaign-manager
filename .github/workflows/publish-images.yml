name: Publish images

# Builds the Docker images on GitHub's runners and pushes them to GHCR,
# so a small droplet only ever downloads ready-made images.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build is tagged with its commit, and only main moves
      # `latest`. Branch builds used to move it too, which was harmless
      # while deploys were manual and is not once they are automatic: a
      # branch build finishing after a merge would leave `latest` pointing
      # at unmerged code, and the next restart on the droplet would
      # quietly run it.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
