# Base stack: API, queue worker, scheduler, frontend.
#
# Database options:
#   - Managed Postgres (e.g. DigitalOcean): set DB_URL in .env and run
#       docker compose up -d --build
#   - Bundled Postgres container: leave DB_URL empty and run
#       docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d --build

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment: &laravel-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?run `openssl rand -base64 32 | sed 's/^/base64:/'` and set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      # A full connection string (managed database) takes precedence over
      # the individual settings below, which default to the bundled db.
      DB_URL: ${DB_URL:-}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-launch_os}
      DB_USERNAME: ${DB_USERNAME:-launch_os}
      DB_PASSWORD: ${DB_PASSWORD:-launch_os}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  queue:
    build: ./backend
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    environment: *laravel-env
    depends_on:
      - backend

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: php artisan schedule:work
    environment: *laravel-env
    depends_on:
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # 8080 by default so the stack can coexist with another app already
      # holding port 80 on the same host.
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
