services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launch_os
      POSTGRES_USER: launch_os
      POSTGRES_PASSWORD: ${DB_PASSWORD:-launch_os}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment: &laravel-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?run `php artisan key:generate --show` and set APP_KEY}
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: launch_os
      DB_USERNAME: launch_os
      DB_PASSWORD: ${DB_PASSWORD:-launch_os}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  queue:
    build: ./backend
    command: php artisan queue:work --tries=3
    environment: *laravel-env
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    command: php artisan schedule:work
    environment: *laravel-env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
