services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: launch_os
      POSTGRES_USER: launch_os
      POSTGRES_PASSWORD: ${DB_PASSWORD:-launch_os}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment: &laravel-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?run `openssl rand -base64 32 | sed 's/^/base64:/'` and set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: launch_os
      DB_USERNAME: launch_os
      DB_PASSWORD: ${DB_PASSWORD:-launch_os}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  queue:
    build: ./backend
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    environment: *laravel-env
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: php artisan schedule:work
    environment: *laravel-env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db-data:
